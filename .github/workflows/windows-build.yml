name: Windows build
run-name: Windows build · ${{ github.ref_name }} · ${{ github.event_name }}
'on':
  push:
    branches:
      - master
      - 'v*-rc*'
    tags:
      - 'v*'
  pull_request:
    branches: [master, 'v*-rc*']

permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.release-info.outputs.artifact }}
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      LAB_OPEN: '0'
      LAB_TRAY: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # schema-upgrade.ts reads source from the previous release tag; a
          # shallow clone without tags does not contain it.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate release version
        id: release-info
        run: bun scripts/build/release-info.ts
      - name: Typecheck
        run: bun run typecheck
      # No QEMU/ISO exists yet: hardware- and real-media-dependent tests skip.
      - name: Unit tests
        run: bun test tests
      - name: Validate repository documentation
        run: bun scripts/checks/repository-check.ts
      - name: Verify v1.1.0 data upgrades to schema v3
        timeout-minutes: 5
        run: bun scripts/checks/schema-upgrade.ts
      - name: Cache pinned QEMU download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .runtime/downloads/qemu-w64-setup-20260811.exe
          key: qemu-windows-x64-20260811-5bcf9eed634e8575a37b74f445af41a2f
      - name: Prepare pinned QEMU (local extraction)
        timeout-minutes: 8
        run: bun run qemu:prepare
      - name: Require real restore-point and recovery tests
        timeout-minutes: 5
        run: bun scripts/checks/restore-points-check.ts
      - name: Require clean recovery after forced process termination
        timeout-minutes: 5
        run: bun scripts/checks/restore-points-process.ts
      - name: Build Windows executable
        run: bun run package -- --with-qemu
      - name: Check packaged startup
        run: bun scripts/checks/ci-startup.ts
      - name: Build basic installer
        run: bun run installer
      - name: Set up Python for packaged UI acceptance
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Playwright and matching Chromium
        timeout-minutes: 5
        run: |
          python -m pip install playwright==1.58.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
      - name: Check final packaged restore points in Chromium
        timeout-minutes: 5
        run: python scripts/checks/restore-points-ui.py --browser-channel chromium
      - name: Check final packaged connection recovery in Chromium
        timeout-minutes: 5
        run: python scripts/checks/connection-ui.py --browser-channel chromium
      - name: Check final installer upgrade and data preservation
        timeout-minutes: 5
        run: bun scripts/checks/installer-smoke.ts
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeskLab-${{ github.run_id }}-${{ github.run_attempt }}-acceptance
          path: |
            .runtime/checks/restore-points-required.log
            .runtime/checks/restore-points-required.json
            .runtime/checks/restore-process-*/result.json
            .runtime/checks/schema-upgrade-*/result.json
            .runtime/checks/restore-points-ui-*/result.json
            .runtime/checks/restore-points-ui-*/artifacts.json
            .runtime/checks/restore-points-ui-*/width-*.png
            .runtime/checks/connection-ui-*/report.json
            .runtime/checks/connection-ui-*/artifacts.json
            .runtime/checks/connection-ui-*/disconnected.png
            .runtime/checks/installer-check-*/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Stage artifacts and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $artifact = "DeskLab-$version-windows-x64-basic"
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/app/DeskLab.exe dist/release/DeskLab.exe
          Copy-Item dist/installer/DeskLab-Setup.exe "dist/release/DeskLab-Setup-v$version-windows-x64.exe"
          Copy-Item dist/installer/DeskLab-Setup.build.json dist/release/
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md dist/release/
          Copy-Item CHANGELOG.md,CONTRIBUTING.md dist/release/
          Copy-Item docs dist/release/docs -Recurse
          'Basic CI build: includes QEMU; no guest ISO or independent Docker Linux image. See README.' | Set-Content dist/release/BUILD-FLAVOR.txt
          Get-ChildItem dist/release/*.exe | ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" } | Set-Content dist/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: dist/release
      - name: Publish verified installer and executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/build/publish-release.ts
